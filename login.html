
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Attendance Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff5f5, #f5f7fb);
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #ffffff;
            padding: 36px;
            border: 1px solid #f0e3e3;
            border-top: 4px solid #ef233c;
            border-radius: 16px;
            box-shadow: 0 14px 40px rgba(31, 41, 55, 0.10);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: #fff0f1;
            color: #e11d48;
            font-size: 27px;
            font-weight: bold;
        }

        h1 {
            margin: 0;
            color: #171717;
            font-size: 25px;
            line-height: 1.35;
        }

        .subtitle {
            margin-top: 10px;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            background: #fff;
            color: #111827;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #ef233c;
            box-shadow: 0 0 0 3px rgba(239, 35, 60, 0.10);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 82px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            width: auto;
            padding: 6px 8px;
            border: none;
            background: transparent;
            color: #dc2626;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-password:hover {
            background: #fff0f1;
            border-radius: 5px;
        }

        .show-password {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            color: #4b5563;
            font-size: 13px;
            font-weight: normal;
            cursor: pointer;
        }

        .show-password input {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: #ef233c;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #ef233c;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #c91832;
        }

        .error {
            margin-bottom: 20px;
            padding: 12px 14px;
            border: 1px solid #fecaca;
            border-radius: 8px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 14px;
            line-height: 1.5;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 26px 22px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <header class="brand">
                <div class="brand-icon" aria-hidden="true">A</div>

                <h1>Student Attendance Portal</h1>

                <p class="subtitle">
                    Sign in with your registered username and password
                </p>
            </header>

            {% if error %}
                <div class="error" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="field">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        value="{{ request.form.get('username', '') }}"
                        required
                        autofocus
                    >
                </div>

                <div class="field">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            class="toggle-password"
                            type="button"
                            id="togglePassword"
                            aria-controls="password"
                            aria-pressed="false"
                        >Show</button>
                    </div>

                    <label class="show-password" for="showPassword">
                        <input type="checkbox" id="showPassword">
                        Show password
                    </label>
                </div>

                <button class="login-button" type="submit">
                    Login
                </button>
            </form>

            <footer class="footer">
                Face Recognition · Liveness Detection · Smart Attendance
                <br>
                Authorized users only
            </footer>
        </section>
    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("togglePassword");
        const showCheckbox = document.getElementById("showPassword");

        function setPasswordVisibility(visible) {
            passwordInput.type = visible ? "text" : "password";
            toggleButton.textContent = visible ? "Hide" : "Show";
            toggleButton.setAttribute("aria-pressed", String(visible));
            showCheckbox.checked = visible;
        }

        toggleButton.addEventListener("click", function () {
            setPasswordVisibility(passwordInput.type === "password");
        });

        showCheckbox.addEventListener("change", function () {
            setPasswordVisibility(this.checked);
        });
    </script>
</body>
</html>
